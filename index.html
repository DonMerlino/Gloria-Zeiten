<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minijob Zeiten</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeiten">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #16181c; --muted: #6b7280; --line: #e5e7eb;
  --accent: #0a7f5a; --accent-soft: #dff3ea; --warn: #c2410c; --warn-soft: #ffedd5;
  --bar2: #7c9cc4; --danger: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214; --card: #1c1d21; --text: #eceef1; --muted: #9aa0a9; --line: #2c2e33;
    --accent: #34c38f; --accent-soft: #163a2c; --warn: #fb923c; --warn-soft: #3b2414;
    --bar2: #6d8cb5; --danger: #f87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 90px; }
h1 { font-size: 28px; margin: 8px 0 12px; letter-spacing: -0.02em; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.muted { color: var(--muted); font-size: 14px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .card { margin: 0; }
.kpi-label { font-size: 13px; color: var(--muted); }
.kpi { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.progress { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 10px 0 6px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 6px; }
.progress.over > div { background: var(--warn); }
.monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.monthnav button { background: var(--card); border: 0; color: var(--text); width: 44px; height: 44px; border-radius: 12px; font-size: 22px; }
.monthnav .title { font-size: 20px; font-weight: 650; }
.list { background: var(--card); border-radius: 14px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
.item .ph { width: 44px; height: 44px; border-radius: 8px; flex: none; background: var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.item .main { flex: 1; min-width: 0; }
.item .dur { font-weight: 650; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; font-weight: 600; }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tr.sum td { font-weight: 700; border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.future td { color: var(--muted) !important; font-style: italic; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav.tabs button { background: none; border: 0; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 14px; }
nav.tabs button.on { color: var(--accent); }
nav.tabs svg { width: 26px; height: 26px; }
.fab { position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 31px;
  background: var(--accent); color: #fff; border: 0; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: grid; place-items: center; z-index: 11; }
.fab svg { width: 30px; height: 30px; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 600; margin-top: 10px; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.secondary { background: var(--line); color: var(--text); }
.btn.danger { background: none; color: var(--danger); }
.btn.small { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
label.field { display: block; margin: 12px 0 0; }
label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
input.uncertain { border-color: var(--warn); background: var(--warn-soft); }
.inline { display: flex; gap: 10px; }
.inline > * { flex: 1; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); z-index: 21; display: none; max-width: 640px; margin: 0 auto; }
.sheet.open, .sheet-bg.open { display: block; }
.sheet h3 { margin: 0 0 6px; font-size: 20px; }
.sheet .photo { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: var(--bg); }
.hint { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); margin-top: 10px; }
.hint.ok { background: var(--accent-soft); color: var(--accent); }
.orig { font-size: 13px; color: var(--muted); margin-top: 4px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: none; place-items: center; color: #fff; font-size: 17px; }
.overlay.open { display: grid; }
.spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.regionwrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; margin-top: 10px; }
.regionwrap img { width: 100%; display: block; border-radius: 8px; }
.regionbox { position: absolute; border: 3px solid var(--warn); background: rgba(251,146,60,.18); border-radius: 4px; pointer-events: none; }
.lightbox { position: fixed; inset: 0; background: #000; z-index: 40; display: none; place-items: center; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 100%; max-height: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(160px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<main id="view"></main>

<button class="fab" id="fab" aria-label="Foto aufnehmen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
</button>
<input type="file" id="photoInput" accept="image/*" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">

<nav class="tabs">
  <button data-tab="month" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Monat</button>
  <button data-tab="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V11M10 20V6M15 20v-8M20 20V9"/></svg>Jahr</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="overlay" id="overlay"><div style="text-align:center"><div class="spinner"></div><div id="overlayText">Lese Zeiten vom Foto …</div></div></div>
<div class="lightbox" id="lightbox"><img alt="Beleg"></div>
<div class="toast" id="toast"></div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
